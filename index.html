<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservoir Computing Playground</title>
    <meta name="description" content="Interactive reservoir computing demos: forecast chaos, recognise gestures and spoken words, and compute with a simulated bucket of water — all trained in milliseconds in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232a78d6'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%23fff'/%3E%3Ccircle cx='21' cy='11' r='3' fill='%23fff'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Before first paint: saved theme, reading level (?explain=) and
      // language (?lang=, saved choice, or Slovak for Slovak browsers).
      (function () {
        var d = document.documentElement;
        function saved(k) {
          try {
            var v = localStorage.getItem(k);
            return v ? JSON.parse(v) : null;
          } catch (e) {
            return null;
          }
        }
        var q = {};
        try {
          q = Object.fromEntries(new URLSearchParams(location.search));
        } catch (e) {}
        var theme = saved('rc-theme');
        if (theme === 'light' || theme === 'dark') d.dataset.theme = theme;
        var level = q.explain || saved('rc-explain');
        d.dataset.explain = level === 'detailed' ? 'detailed' : 'simple';
        var lang = q.lang || saved('rc-lang');
        if (lang !== 'sk' && lang !== 'en') {
          var first = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
          lang = first.indexOf('sk') === 0 ? 'sk' : 'en';
        }
        d.lang = lang;
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="#intro" aria-label="Reservoir Computing Playground, home">
          <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="var(--accent)" />
            <g stroke="#fff" stroke-width="1.4" opacity="0.8">
              <line x1="10" y1="11" x2="21" y2="10" />
              <line x1="21" y1="10" x2="16" y2="21" />
              <line x1="16" y1="21" x2="10" y2="11" />
            </g>
            <circle cx="10" cy="11" r="3" fill="#fff" />
            <circle cx="21" cy="10" r="3" fill="#fff" />
            <circle cx="16" cy="21" r="3" fill="#fff" />
          </svg>
          <span id="brand-name">Reservoir Playground</span>
        </a>
        <nav class="tabs" id="tabs" aria-label="Demos">
          <a class="tab" href="#intro" data-view="intro">Intro</a>
          <a class="tab" href="#chaos" data-view="chaos">Chaos</a>
          <a class="tab" href="#gestures" data-view="gestures">Gestures</a>
          <a class="tab" href="#speech" data-view="speech">Speech</a>
          <a class="tab" href="#water" data-view="water">Water</a>
        </nav>
        <div class="lang-switch segmented" id="lang-switch" role="group" aria-label="Language">
          <button type="button" class="seg" data-lang="en" lang="en">EN</button>
          <button type="button" class="seg" data-lang="sk" lang="sk">SK</button>
        </div>
        <button type="button" class="btn small theme-toggle" id="theme-toggle" aria-label="Colour theme">◐</button>
      </div>
    </header>

    <main>
      <section class="view" id="view-intro" data-view="intro"></section>
      <section class="view" id="view-chaos" data-view="chaos" hidden></section>
      <section class="view" id="view-gestures" data-view="gestures" hidden></section>
      <section class="view" id="view-speech" data-view="speech" hidden></section>
      <section class="view" id="view-water" data-view="water" hidden></section>
    </main>

    <footer>
      <span id="footer-text">Everything runs locally in your browser and nothing is uploaded. Free software under the GNU GPL v3.</span>
      <a href="https://github.com/m1omg/ReservoirWebDemo" id="footer-source">Source code</a>.
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
